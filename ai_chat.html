<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - Your Social Media Helper</title>
    <style>
        .ai-chat-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 350px;
            height: 500px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            z-index: 10000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .ai-chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 15px 15px 0 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-avatar {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .ai-chat-title {
            flex: 1;
        }

        .ai-chat-title h3 {
            margin: 0;
            font-size: 16px;
        }

        .ai-chat-title p {
            margin: 0;
            font-size: 12px;
            opacity: 0.8;
        }

        .chat-close {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #764ba2;
        }

        .message-content {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
        }

        .message.ai .message-content {
            white-space: pre-line;
            line-height: 1.4;
        }

        .chat-input-container {
            padding: 15px;
            border-top: 1px solid #e9ecef;
            background: white;
            border-radius: 0 0 15px 15px;
        }

        .chat-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e9ecef;
            border-radius: 25px;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 14px;
        }

        .chat-input:focus {
            border-color: #667eea;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }

        .quick-action {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 15px;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-action:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .typing-indicator {
            display: none;
            padding: 10px 15px;
            color: #666;
            font-style: italic;
        }

        .typing-dots {
            display: inline-block;
        }

        .typing-dots span {
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        .ai-chat-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 9999;
            transition: transform 0.3s ease;
        }

        .ai-chat-toggle:hover {
            transform: scale(1.1);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- AI Chat Toggle Button -->
    <div class="ai-chat-toggle" id="aiChatToggle">
        🤖
    </div>

    <!-- AI Chat Widget -->
    <div class="ai-chat-widget hidden" id="aiChatWidget">
        <div class="ai-chat-header">
            <div class="ai-avatar">🤖</div>
            <div class="ai-chat-title">
                <h3>AI Assistant</h3>
                <p>Ready to help you!</p>
            </div>
            <button class="chat-close" id="chatClose">×</button>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                <div class="message-avatar">AI</div>
                <div class="message-content">
                    Hello! I'm your AI assistant 🤖 How can I help you with the platform today?
                    
                    Try asking me:
                    • "Recommend funny videos"
                    • "What's trending?"
                    • "How to get more followers?"
                </div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            AI is thinking<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
        
        <div class="chat-input-container">
            <textarea class="chat-input" id="chatInput" placeholder="Ask me anything about the platform..." rows="1"></textarea>
            
            <div class="quick-actions">
                <div class="quick-action" data-message="Recommend funny videos">😂 Funny Videos</div>
                <div class="quick-action" data-message="What's trending right now?">🔥 Trending</div>
                <div class="quick-action" data-message="How to get more followers?">👥 Followers</div>
                <div class="quick-action" data-message="Help with my profile">📱 Profile Help</div>
            </div>
        </div>
    </div>

    <script>
        class AIChat {
            constructor() {
                this.widget = document.getElementById('aiChatWidget');
                this.toggle = document.getElementById('aiChatToggle');
                this.messages = document.getElementById('chatMessages');
                this.input = document.getElementById('chatInput');
                this.typing = document.getElementById('typingIndicator');
                this.closeBtn = document.getElementById('chatClose');
                
                this.init();
            }
            
            init() {
                this.toggle.addEventListener('click', () => this.toggleChat());
                this.closeBtn.addEventListener('click', () => this.hideChat());
                this.input.addEventListener('keypress', (e) => this.handleInput(e));
                
                // Quick actions
                document.querySelectorAll('.quick-action').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const message = e.target.getAttribute('data-message');
                        this.sendMessage(message);
                    });
                });
                
                // Auto-resize textarea
                this.input.addEventListener('input', () => {
                    this.input.style.height = 'auto';
                    this.input.style.height = Math.min(this.input.scrollHeight, 100) + 'px';
                });
                
                this.loadChatHistory();
            }
            
            toggleChat() {
                this.widget.classList.toggle('hidden');
                if (!this.widget.classList.contains('hidden')) {
                    this.input.focus();
                }
            }
            
            hideChat() {
                this.widget.classList.add('hidden');
            }
            
            handleInput(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    const message = this.input.value.trim();
                    if (message) {
                        this.sendMessage(message);
                        this.input.value = '';
                        this.input.style.height = 'auto';
                    }
                }
            }
            
            async sendMessage(message) {
                this.addMessage(message, 'user');
                this.showTyping();
                
                try {
                    const response = await fetch('ai_assistant.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams({
                            'action': 'chat',
                            'message': message
                        })
                    });
                    
                    const data = await response.json();
                    
                    this.hideTyping();
                    
                    if (data.success) {
                        this.addMessage(data.response, 'ai');
                        this.saveToHistory(message, data.response);
                    } else {
                        this.addMessage('Sorry, I encountered an error. Please try again.', 'ai');
                    }
                    
                } catch (error) {
                    console.error('Chat error:', error);
                    this.hideTyping();
                    this.addMessage('Network error. Please check your connection and try again.', 'ai');
                }
            }
            
            addMessage(content, type) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${type}`;
                
                const avatar = document.createElement('div');
                avatar.className = 'message-avatar';
                avatar.textContent = type === 'user' ? 'You' : 'AI';
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.innerHTML = content.replace(/\n/g, '<br>');
                
                messageDiv.appendChild(avatar);
                messageDiv.appendChild(contentDiv);
                
                this.messages.appendChild(messageDiv);
                this.scrollToBottom();
            }
            
            showTyping() {
                this.typing.style.display = 'block';
                this.scrollToBottom();
            }
            
            hideTyping() {
                this.typing.style.display = 'none';
            }
            
            scrollToBottom() {
                this.messages.scrollTop = this.messages.scrollHeight;
            }
            
            saveToHistory(userMessage, aiResponse) {
                const history = this.getChatHistory();
                history.push({
                    user: userMessage,
                    ai: aiResponse,
                    timestamp: new Date().toISOString()
                });
                
                // Keep only last 50 messages
                if (history.length > 50) {
                    history.shift();
                }
                
                localStorage.setItem('ai_chat_history', JSON.stringify(history));
            }
            
            loadChatHistory() {
                const history = this.getChatHistory();
                const recentHistory = history.slice(-10); // Load last 10 messages
                
                recentHistory.forEach(msg => {
                    this.addMessage(msg.user, 'user');
                    this.addMessage(msg.ai, 'ai');
                });
            }
            
            getChatHistory() {
                return JSON.parse(localStorage.getItem('ai_chat_history') || '[]');
            }
        }
        
        // Initialize chat when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new AIChat();
        });
    </script>
</body>
</html>
